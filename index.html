<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f0" />

    <!--
      Content Security Policy — defense in depth.
      'unsafe-inline' on style-src is required because Tailwind utility classes
      and React inline style props (style={{...}}) generate inline styles.
      Standard for Tailwind apps; not a real risk for a static site with no
      user-generated content.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data:;
        script-src 'self';
        connect-src 'self';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        object-src 'none';
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>CPDHTS Practice — Scenario-based study tool</title>
    <meta name="description" content="158 scenario-based practice questions for the HIMSS CPDHTS exam, hand-vetted across all four domains with rationales for every answer." />

    <!-- Open Graph / link preview metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CPDHTS Practice — Scenario-based study tool" />
    <meta property="og:description" content="158 hand-vetted scenario questions across the four HIMSS CPDHTS domains. Audited and corrected for common LLM-generated test biases." />
    <meta property="og:url" content="https://trajeshwin.github.io/cpdhts-practice/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CPDHTS Practice — Scenario-based study tool" />
    <meta name="twitter:description" content="158 hand-vetted scenario questions across the four HIMSS CPDHTS domains. Audited and corrected for common LLM-generated test biases." />
