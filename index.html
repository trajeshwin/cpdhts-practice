<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f0" />

    <!--
      Content Security Policy — defense in depth.
      'unsafe-inline' on style-src is required because Tailwind utility classes
      and React inline style props (style={{...}}) generate inline styles.
      Standard for Tailwind apps; not a real risk for a static site with no
      user-generated content.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data:;
        script-src 'self';
        connect-src 'self';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        object-src 'none';
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>CPDHTS Practice</title>

    <!-- Self-hosted fonts — see /public/fonts/ and /src/fonts.css -->
    <link rel="preload" href="./fonts/Inter-VariableFont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Fraunces-VariableFont.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" crossorigin src="./assets/index-6FrAH3qW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bcuq1eK5.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
